# Import these individually or append them to automations.yaml.
- id: vitality_assist_log_coffee
  alias: Vitality - log coffee with Assist
  triggers:
    - trigger: conversation
      command: "log coffee"
  actions:
    - action: vitality.log_event
      data:
        activity_type: coffee
    - set_conversation_response: "Coffee logged."
  mode: queued

- id: vitality_assist_log_mood
  alias: Vitality - log mood with Assist
  triggers:
    - trigger: conversation
      command: "log mood {1..10:score}"
  actions:
    - action: vitality.log_checkin
      data:
        kind: mood
        score: "{{ trigger.slots.score | int }}"
    - set_conversation_response: "Mood logged."
  mode: queued

- id: vitality_assist_morning_energy
  alias: Vitality - log perceived energy with Assist
  triggers:
    - trigger: conversation
      command: "log perceived energy {1..10:score}"
  actions:
    - action: vitality.log_checkin
      data:
        kind: energy
        score: "{{ trigger.slots.score | int }}"
    - set_conversation_response: "Perceived energy logged."
  mode: queued
