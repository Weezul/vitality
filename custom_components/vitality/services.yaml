log_event:
  name: Log activity
  description: Record one occurrence of a configured activity.
  fields:
    activity_type:
      name: Activity type
      description: Configured stable ID, name or alias.
      required: true
      selector:
        text:
    quantity:
      name: Quantity
      description: Positive finite quantity. Defaults to 1.
      selector:
        number:
          min: 0
          mode: box
    unit:
      name: Unit
      description: Optional unit override.
      selector:
        text:
    occurred_at:
      name: Occurred at
      description: ISO 8601 timestamp with offset. Omit on create to use now.
      selector:
        text:
    notes:
      name: Notes
      description: Optional diary context.
      selector:
        text:
          multiline: true
    duration_minutes:
      name: Duration
      description: Optional duration in minutes.
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: min

log_checkin:
  name: Log check-in
  description: Record a subjective score.
  fields:
    kind:
      name: Check-in type
      description: Choose morning, evening, other, or mood.
      required: true
      selector:
        select:
          options:
            - morning
            - evening
            - other
            - mood
    score:
      name: Score
      description: Whole-number subjective score from 1 to 10.
      required: true
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider
    occurred_at:
      name: Occurred at
      description: ISO 8601 timestamp with offset. Omit on create to use now.
      selector:
        text:
    notes:
      name: Notes
      description: Optional diary context.
      selector:
        text:
          multiline: true

